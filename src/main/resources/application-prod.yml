spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:documind_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Flyway 마이그레이션 설정
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate # 스키마 자동 변경 방지
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: [ read:user,user:email ]
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [ openid, profile, email ]

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  cloud:
    aws:
      region:
        static: ${AWS_S3_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}

  # Ollama 자동 구성 비활성화 (운영 환경에서 미사용)
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration

  ai:
    model:
      embedding: openai

    # OpenAI API
    openai:
      api-key: ${OPENAI_API_KEY}
      # 패치노트 생성 등 장시간 LLM 호출 대응: 연결 10초, 읽기 1분
      http:
        connect-timeout: PT10S
        read-timeout: PT1M
      embedding:
        options:
          model: text-embedding-3-large
          dimensions: 1536 # 3072 → 1536 차원 축소 (HNSW 인덱스 최대 2000)

    vectorstore:
      pgvector:
        initialize-schema: false # 운영 환경에서는 수동 스키마 관리
        dimensions: 1536 # 임베딩 벡터 차원 (text-embedding-3-large 축소)

redis:
  stream:
    key: ${REDIS_STREAM_KEY:stream:log-stream}
    group: ${REDIS_STREAM_GROUP:log-group}
    consumer: ${REDIS_STREAM_CONSUMER:log-consumer-1}

    # 향후 스트림 전용 ElastiCache 도입 시 코드를 분리하기 위한 설정
    # 기본값은 REDIS_HOST를 따라가게 하여 1개일 때도 작동함
    host: ${STREAM_REDIS_HOST:${REDIS_HOST:redis}}
    port: ${STREAM_REDIS_PORT:${REDIS_PORT:6379}}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      influx:
        enabled: ${INFLUX_ENABLED:true}
        uri: http://${INFLUX_HOST:influxdb}:${INFLUX_PORT:8086}
        db: ${INFLUX_DB:k6}
  health:
    circuitbreakers:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-seconds: 1800     # 30분
    refresh-expiration-seconds: 604800  # 7일
    access-cookie-name: access_token
    refresh-cookie-name: refresh_token
    cookie-secure: true   # 운영 환경: HTTPS 필수
    redis-prefix: "jwt:"

  oauth2:
    redirect-base-url: ${APP_BASE_URL}

  chat:
    default-model: gpt-4.1-mini # 기본 선택 모델 (alias)
    patchnote-default-model: gpt-4.1-mini # 패치노트 생성 기본 모델 (초안·이슈·문서 요약 공통)
    models:
      - provider: openai
        model-id: gpt-4.1-nano
        alias: gpt-4.1-nano
        display-name: GPT-4.1 Nano
      - provider: openai
        model-id: gpt-4.1-mini
        alias: gpt-4.1-mini
        display-name: GPT-4.1 Mini
      - provider: openai
        model-id: gpt-5-nano
        alias: gpt-5-nano
        display-name: GPT-5 Nano
        reasoning: true
      - provider: openai
        model-id: gpt-5-mini
        alias: gpt-5-mini
        display-name: GPT-5 Mini
        reasoning: true
      - provider: google-genai
        model-id: gemini-2.5-flash
        alias: gemini-2.5-flash
        display-name: Gemini 2.5 Flash
      - provider: google-genai
        model-id: gemini-2.5-flash-lite
        alias: gemini-2.5-flash-lite
        display-name: Gemini 2.5 Flash-Lite

  rate-limit:
    ingest:
      capacity: 50 # 초당 허용할 최대 API 요청 횟수
      expiration-hours: 1 # 버킷 메모리 유지 시간 (hour 단위)
      redis-prefix: "ratelimit:ingest"
    query:
      capacity: 20
      expiration-hours: 1
      redis-prefix: "ratelimit:query"

  api-key:
    hmac-secret: ${API_KEY_HMAC_SECRET}

  invitation:
    expiration-hours: 72
    hmac-secret: ${INVITATION_HMAC_SECRET}

  mail:
    from-address: ${GMAIL_FROM_ADDRESS}

  patchnote:
    rag:
      token-limit: 12000
      prompt-overhead: 800

worker:
    # 배치 처리 설정
    bulk:
        size: ${WORKER_BULK_SIZE:1000}  # 배치 크기
        flush-interval-ms: ${WORKER_BULK_FLUSH_INTERVAL_MS:1000}  # 플러시 주기 (1초)

    # 버퍼 설정
    buffer:
        max-size: ${WORKER_BUFFER_MAX_SIZE:10000}  # 최대 버퍼 크기

    # JDBC 배치 설정
    jdbc:
        batch-size: ${WORKER_JDBC_BATCH_SIZE:1000}  # JDBC 배치 크기

    # Redis Streams 폴링 설정
    poll-interval-ms: ${POLL_INTERVAL_MS:5000}  # 폴링 주기 (5초)
    poll-block-ms: ${POLL_BLOCK_MS:2000}        # XREADGROUP BLOCK 시간 (2초)

    # Lag 모니터링 설정
    lag-monitor:
        # Redis Stream Lag 수집 주기 (밀리초)
        interval-ms: ${LAG_MONITOR_INTERVAL_MS:5000}

    # Backpressure 설정
    backpressure:
        # DB Insert 평균 지연이 이 값 이상이면 WARN 상태로 전환
        warn-threshold-ms: ${BACKPRESSURE_WARN_THRESHOLD_MS:500}
        # DB Insert 평균 지연이 이 값 이상이면 CRITICAL 상태로 전환
        critical-threshold-ms: ${BACKPRESSURE_CRITICAL_THRESHOLD_MS:2000}
        # WARN 상태에서 Redis 소비 스레드가 대기하는 시간
        warn-sleep-ms: ${BACKPRESSURE_WARN_SLEEP_MS:200}
        # CRITICAL 상태에서 Redis 소비 스레드가 대기하는 시간
        critical-sleep-ms: ${BACKPRESSURE_CRITICAL_SLEEP_MS:1000}
        # 배치 크기 동적 조절 설정
        initial-batch-size: ${BACKPRESSURE_INITIAL_BATCH_SIZE:100}
        min-batch-size: ${BACKPRESSURE_MIN_BATCH_SIZE:10}
        max-batch-size: ${BACKPRESSURE_MAX_BATCH_SIZE:500}
        # 배치 크기 증가 임계값 (처리 시간이 이 값 미만이면 증가)
        increase-threshold-ms: ${BACKPRESSURE_INCREASE_THRESHOLD_MS:1000}
        # 배치 크기 감소 임계값 (처리 시간이 이 값 이상이면 감소)
        decrease-threshold-ms: ${BACKPRESSURE_DECREASE_THRESHOLD_MS:5000}
    dlq:
        # Dead Letter Queue 최대 재시도 횟수
        max-retry: ${DLQ_MAX_RETRY:5}
        # DLQ 재시도 주기 (밀리초)
        retry-interval-ms: ${DLQ_RETRY_INTERVAL_MS:5000}

logging:
  level:
    org.springframework.ai.chat.client.advisor: info

# Resilience4j Circuit Breaker & Retry 설정
resilience4j:
    circuitbreaker:
        instances:
            redisStreamConsumer:
                failure-rate-threshold: 50                    # 실패율 50% 초과 → OPEN
                minimum-number-of-calls: 3                    # 최소 3회 호출 후 평가
                sliding-window-size: 10                       # 최근 10회 기준
                wait-duration-in-open-state: 10s              # OPEN 상태 10초 유지
                permitted-number-of-calls-in-half-open-state: 2
                automatic-transition-from-open-to-half-open-enabled: true
                record-exceptions:
                    - org.springframework.data.redis.RedisConnectionFailureException
                    - org.springframework.data.redis.RedisSystemException
                    - java.io.IOException

    retry:
        instances:
            redisStreamConsumer:
                max-attempts: 5                               # 최대 5회 재시도
                wait-duration: 1s                             # 초기 대기 1초
                enable-exponential-backoff: true              # 지수 백오프
                exponential-backoff-multiplier: 2             # 2배씩 증가
                exponential-max-wait-duration: 30s            # 최대 30초
                retry-exceptions:
                    - org.springframework.data.redis.RedisConnectionFailureException
